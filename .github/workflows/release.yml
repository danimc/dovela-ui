name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1. Track
          # the 22 line rather than a pin: npm@latest (12.x) itself requires
          # Node >= 22.22.2, so a pinned 22.14.0 fails the upgrade below.
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # The npm bundled with the runner image does the OIDC token exchange —
      # an old one fails with a misleading E404. Upgrade it explicitly.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile

      # Opens (or updates) a "Version Packages" PR while changesets are
      # pending; publishes to npm once that PR is merged.
      #
      # No NPM_TOKEN: publishing authenticates via OIDC trusted publishing
      # (`id-token: write` above). npm is deprecating direct publishing from
      # 2FA-bypass tokens around Jan 2027. Each package must have this repo +
      # `release.yml` registered under Settings -> Trusted Publisher on npm.
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
