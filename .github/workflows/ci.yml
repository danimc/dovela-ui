name: CI

on:
  push:
    # `changeset-release/*` is the branch the Release workflow pushes the
    # "Version Packages" PR to. Without it that PR carries no check run,
    # because PRs opened by GITHUB_TOKEN do not trigger `pull_request`.
    branches: [main, dev, "changeset-release/**"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Browser-mode tests need a real Chromium — that is where axe can measure
      # contrast and where focus behaviour is not a jsdom approximation.
      - run: pnpm --filter @dovela-ui/react exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
