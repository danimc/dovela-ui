name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Browser-mode tests need a real Chromium — that is where axe can measure
      # contrast and where focus behaviour is not a jsdom approximation.
      - run: pnpm --filter @dovela-ui/react exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
